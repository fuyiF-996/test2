<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>幸运抛硬币</title>
    <link rel="stylesheet" href="coin-style.css?v=20260824-4">
</head>
<body>
    <header>
        <h1>幸运抛硬币</h1>
        <p>输入数字，看看今天手气如何</p>
    </header>

    <main class="coin-stage" id="coinStage">
        <!-- 硬币由 JS 动态生成 -->
    </main>

    <section class="coin-controls">
        <div class="input-row">
            <input
                type="text"
                inputmode="numeric"
                id="numberInput"
                placeholder="输入数字，如 1、2、10"
                autocomplete="off"
            >
            <button id="flipBtn" type="button">开始抛硬币</button>
        </div>
        <div id="messageBox"></div>
    </section>

    <section class="result-area" id="resultArea">
        <div class="result-stats" id="resultStats"></div>
        <div class="result-chart" id="resultChart"></div>
    </section>

    <!-- 实用小工具面板 -->
    <section class="tools-panel" id="toolsPanel">
        <button class="tools-toggle" id="toolsToggle" type="button" aria-expanded="false">
            <span class="toggle-icon">🧰</span>
            <span class="toggle-text">实用小工具</span>
            <span class="toggle-arrow" id="toolsArrow">▼</span>
        </button>
        <div class="tools-content" id="toolsContent" aria-hidden="true">
            <div class="tools-grid">
                <!-- 倒计时器 -->
                <div class="tool-card">
                    <h3 class="tool-title">⏳ 倒计时器</h3>
                    <div class="tool-range-row">
                        <input class="tool-input tool-input-small" id="countdownMin" type="number" min="0" placeholder="分" value="1">
                        <span class="tool-range-sep">:</span>
                        <input class="tool-input tool-input-small" id="countdownSec" type="number" min="0" max="59" placeholder="秒" value="0">
                    </div>
                    <div class="countdown-display" id="countdownDisplay">01:00</div>
                    <div class="countdown-controls">
                        <button class="tool-btn" id="countdownStart" type="button">开始</button>
                        <button class="tool-btn" id="countdownPause" type="button">暂停</button>
                        <button class="tool-btn" id="countdownReset" type="button">重置</button>
                    </div>
                    <div class="tool-result" id="countdownResult"></div>
                </div>

                <!-- YES / NO -->
                <div class="tool-card">
                    <h3 class="tool-title">⚖️ YES / NO</h3>
                    <p class="tool-desc">心里默念问题，点击获取答案</p>
                    <button class="tool-btn tool-btn-large" id="yesNoBtn" type="button">获取答案</button>
                    <div class="tool-result" id="yesNoResult"></div>
                </div>

                <!-- 随机数字 -->
                <div class="tool-card">
                    <h3 class="tool-title">🎲 随机数字</h3>
                    <div class="tool-range-row">
                        <input class="tool-input tool-input-small" id="randomMin" type="number" placeholder="最小" value="1">
                        <span class="tool-range-sep">~</span>
                        <input class="tool-input tool-input-small" id="randomMax" type="number" placeholder="最大" value="100">
                    </div>
                    <button class="tool-btn" id="randomNumBtn" type="button">生成</button>
                    <div class="tool-result" id="randomNumResult"></div>
                </div>

                <!-- BMI 计算器 -->
                <div class="tool-card">
                    <h3 class="tool-title">⚖️ BMI 计算器</h3>
                    <div class="tool-range-row">
                        <input class="tool-input tool-input-small" id="bmiHeight" type="number" min="1" placeholder="身高 cm" value="170">
                        <span class="tool-range-sep">|</span>
                        <input class="tool-input tool-input-small" id="bmiWeight" type="number" min="1" placeholder="体重 kg" value="65">
                    </div>
                    <button class="tool-btn" id="bmiCalcBtn" type="button">计算</button>
                    <div class="tool-result" id="bmiResult"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 樱花图集全屏 iframe：音乐由父页面持续播放，避免跳转中断 -->
    <iframe
        class="gallery-frame"
        id="galleryFrame"
        src="about:blank"
        title="樱花图集"
        sandbox="allow-same-origin allow-scripts"
    ></iframe>

    <script src="coin.js?v=20260824-4"></script>
</body>
</html>
